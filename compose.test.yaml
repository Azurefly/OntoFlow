# Isolated disposable PG integration suite. Not the application compose file.
# No .env, no host volumes, no production credentials or published ports.
name: ontoflow-v137-regression
services:
  pgtest:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ontology_test
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: test_only_local_137
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 40
  regression:
    build:
      context: .
      dockerfile: Dockerfile.test
    command: ["python", "-m", "pytest", "-q", "tests/test_postgres_integration_v137.py"]
    environment:
      APP_ENV: development
      ONTOFLOW_TEST_PG_ADMIN_DSN: postgresql://ontology_test:test_only_local_137@pgtest:5432/postgres
    depends_on:
      pgtest:
        condition: service_healthy
