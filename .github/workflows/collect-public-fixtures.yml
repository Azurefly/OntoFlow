name: Collect public test documents
on:
  push:
    paths:
      - '.github/workflows/collect-public-fixtures.yml'
      - 'scripts/collect_public_fixtures.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect upstream samples and provenance
        run: python scripts/collect_public_fixtures.py --output collected-public-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-test-documents
          path: collected-public-fixtures/
          retention-days: 7
