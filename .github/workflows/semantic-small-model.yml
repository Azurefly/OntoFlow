name: Small public model semantic contract check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/semantic-small-model.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v143-staged-source-and-regression
          run-id: 42582999515
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/staged
      - name: Use exact staged application already regression-tested
        run: tar -xzf "$RUNNER_TEMP/staged/tested-source.tar.gz"
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install actual runtime and independent readers
        run: |
          python -m pip install -r requirements-dev.txt -c requirements-tested-constraints.txt
          python -m pip install huggingface_hub requests
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - uses: actions/download-artifact@v4
        with:
          name: complex-business-documents-20261108
          run-id: 42447860392
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/business
      - uses: actions/download-artifact@v4
        with:
          name: complex-business-supplement-20261108
          run-id: 42448313997
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/supplement
      - name: Download official small GGUF without injected model replies
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
        run: |
          mkdir -p ci-semantic "$RUNNER_TEMP/models"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          repo='Qwen/Qwen2.5-1.5B-Instruct-GGUF';info=HfApi().model_info(repo,files_metadata=True)
          files=sorted(x.rfilename for x in info.siblings if 'q4_k_m' in x.rfilename.lower() and x.rfilename.endswith('.gguf'))
          assert files and len(files)<=4,files
          rows=[]
          for name in files:
            p=Path(hf_hub_download(repo,name,revision=info.sha,local_dir=os.environ['RUNNER_TEMP']+'/models'))
            h=hashlib.sha256()
            with p.open('rb') as f:
              for chunk in iter(lambda:f.read(8*1024*1024),b''):h.update(chunk)
            rows.append({'file':name,'bytes':p.stat().st_size,'sha256':h.hexdigest()})
          Path('ci-semantic/model.json').write_text(json.dumps({'repository':repo,'revision':info.sha,'files':rows,'device':'CPU','comparison_note':'Different quantized runtime from prior float32 probe; not a controlled accuracy comparison'},indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('MODEL_FILE='+files[0]+'\n')
          PY
      - name: Start actual inference on loopback
        run: |
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker image inspect ghcr.io/ggml-org/llama.cpp:server > ci-semantic/runtime-image.json
          docker run --rm -d --name ontology-model -p 127.0.0.1:8766:8080 -v "$RUNNER_TEMP/models:/models:ro" ghcr.io/ggml-org/llama.cpp:server -m "/models/$MODEL_FILE" -c 8192 -t 4 -ngl 0 -np 1 --host 0.0.0.0 --port 8080 --alias Qwen2.5-1.5B-Instruct-Q4_K_M
          python - <<'PY'
          import time,urllib.request
          for _ in range(60):
            try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health',timeout=5) as r:
                if r.status==200:break
            except Exception:time.sleep(2)
          else:raise SystemExit('Model startup failed')
          PY
      - name: Run identical unmocked application and excerpt selection
        run: |
          set -o pipefail
          python -m scripts.semantic_acceptance --inputs "$RUNNER_TEMP/inputs" --output ci-semantic --model Qwen2.5-1.5B-Instruct-Q4_K_M --structured-output json_schema 2>&1 | tee ci-semantic/run.log
      - name: Preserve failure details and stop isolated model
        if: always()
        run: |
          mkdir -p ci-semantic
          docker logs ontology-model > ci-semantic/model-server.log 2>&1 || true
          docker stop ontology-model || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v143-small-model-semantic-results
          path: ci-semantic/
          retention-days: 30
