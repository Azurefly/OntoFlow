name: Regression and frozen internet corpus
on:
  push:
    branches: [main]
    paths-ignore: ['reports/**', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt -c requirements-tested-constraints.txt
      - name: Existing unit and API regression
        run: |
          set -o pipefail
          mkdir -p ci-results
          python -m pytest -q --junitxml=ci-results/regression.xml | tee ci-results/regression.log
      - run: node --check static/app.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: ci-results/
  real-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ontology_test
          POSTGRES_PASSWORD: ci_only_temporary_not_a_deployed_secret
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ontology_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -c requirements-tested-constraints.txt
      - name: Isolated real PG gate (creates random temporary DBs)
        env:
          ONTOFLOW_TEST_PG_ADMIN_DSN: postgresql://ontology_test:ci_only_temporary_not_a_deployed_secret@127.0.0.1:5432/postgres
        run: |
          set -o pipefail
          mkdir -p ci-results
          python -m pytest -q tests/test_postgres_integration_v137.py --junitxml=ci-results/postgresql.xml | tee ci-results/postgresql.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-postgresql-results
          path: ci-results/
  frozen-internet-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -c requirements-tested-constraints.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Fetch exact upstream bytes, not test answers
        run: python scripts/fetch_external_corpus.py --manifest reports/internet-2026-11-07/manifest.json --output /tmp/ontoflow-corpus
      - name: Audit all samples; keep parse failures in results
        run: python -m scripts.audit_external_documents --corpus /tmp/ontoflow-corpus --output ci-results/external
      - name: Reject crashes, hidden source changes and real model calls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('ci-results/external')
          s=json.loads((root/'summary.json').read_text())
          r=json.loads((root/'results.json').read_text())
          assert s['source_unchanged']
          assert not s['unexpected_model_requests']
          assert all(v['checks']['sha256_matches'] and v['checks']['git_blob_matches'] for v in r)
          assert all(v['api'].get('upload_http_status') in (200,202,415,422) for v in r)
          print('Parse failures are recorded, not counted as semantic accuracy passes:',s['parse_statuses'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-corpus-audit
          path: ci-results/external/
