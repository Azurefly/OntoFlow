name: Verify source transfer fragments
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-source-fragments.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read and verify source fragments already uploaded to this repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, concurrent.futures, hashlib, json, os, urllib.request, urllib.error
          from pathlib import Path
          expected = '''feeb3d2793458739c99f49ed3445fd759970d41b c452e49df2a6fa966bf9abc5d27dc0258d50c24d ea84ee0465f71c5cd19a055e35abcc3ec18476d3 88a094d3e2e1cb9735d86cbcdf55cbcc3bb49ca5 56bfd066bf6bfc9167db28bfabcea1d72a3ba9ce ac1bdaa1103753470b23589f61406d23f7a084ae 47b2e67b0408a40b6635b34f08bd754d8ddf7223 260db2a72eef4cf8bf82b00067b893a8ff348144 97c84a99a3545f369186683642a9e7d3c70718db a8bdfa2821d9fbe7712598c4425b1a0981f2f0e4 cc784bca3e4ec128c9fedc154267042d9811fc5e 6e046a0da966f074f040a05bf58ef4611164bb13 1195a7bcc9e8d8ee1309f0b4e68740608a87ca7b 1f023472e8193ec5a4b1fb0b57ac8d39cf7eb6fa f874508b85664582a874ef54cf5368a041b10010 bd766118b8ec0826c2f1ab4d5213e59fe3e0e80d ee503423a84a6b069d091813e519872e77425799 1db9d70b5ba5834ea6d342191bf36d4bf96b4bff a68abbf84886bc5dd2930d1bd08d077bc0388701 8a59c8ad5ef7fb1b413ed530b17210078db42a7f 2c1e1bfd93d61309626a2454febc2becb1aa9d5a c1c6f8f4966c4571085141a6e21c6c3fec15d472 a581f30f0ddfddcbc03aa1c7fe2b13f28e2bfc91 60100fed5d5fc3ac3144e5f1006b68d4125755af'''.split()
          alternatives = '''b2ec270891fefd5f2997f9eb116a255e252f89c5 d6c21cba8dd57fe2746d428b22b2fd4c8cf19bcf 93d58612acfc0bfbf4c802f8b429bc7112c7de64 a0e5a76f3f5a2f6bdfcc2163eb546cdc56464de6 4c8712e1741e342f1d7ee9eb9c9e3ce115bef0b6'''.split()
          root = Path('fragment-audit'); root.mkdir()
          def fetch(sha):
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPO"]}/git/blobs/{sha}', headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'User-Agent':'ontoflow-source-verification'})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response: obj=json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code==404: return {'sha':sha,'exists':False}
                  raise
              raw=base64.b64decode(obj['content'])
              actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert actual==sha
              (root/(sha+'.bin')).write_bytes(raw)
              return {'sha':sha,'exists':True,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: rows=list(pool.map(fetch,expected+alternatives))
          (root/'manifest.json').write_text(json.dumps({'expected':expected,'results':rows},indent=2))
          print(json.dumps({'expected_total':len(expected),'expected_found':sum(row['exists'] for row in rows[:len(expected)]),'missing':[row['sha'] for row in rows[:len(expected)] if not row['exists']],'alternatives':[row for row in rows[len(expected):]]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-fragment-audit
          path: fragment-audit/
          retention-days: 1
